{
  "id": "example.workflow-notes",
  "name": "Minimal Plugin API v2 Example",
  "version": "0.1.0-dev",
  "plugin_api": 2,
  "publisher": "mcxianyujun",
  "license": "AGPL-3.0-only",
  "description": "Developer reference: one observation Hook, one integer Tool, config and plugin-owned data.",
  "maintune": {
    "min_version": "0.1.0-preview.3"
  },
  "runtime": {
    "default": "isolated",
    "supported": [
      "isolated"
    ]
  },
  "entrypoint": {
    "python": "workflow_notes"
  },
  "python": {
    "dependencies": "requirements.txt"
  },
  "config_schema": {
    "type": "object",
    "properties": {
      "label": {
        "type": "string",
        "title": "Display label",
        "minLength": 1,
        "maxLength": 60,
        "default": "Example"
      },
      "demo_secret": {
        "type": "string",
        "title": "Demo secret (optional, never used externally)",
        "secret": true,
        "minLength": 1
      }
    },
    "additionalProperties": false
  }
}
